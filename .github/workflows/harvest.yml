name: Harvest approved sources

on:
  workflow_dispatch:
  schedule:
    - cron: "43 */6 * * *"

jobs:
  harvest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      HARVEST_USER_AGENT: CommunityFinderHarvester/1.0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install Python dependencies
        run: python -m pip install requests
        
           - name: Validate Python files
        run: |
          python -m py_compile \
            source_discovery.py \
            source_discovery_upload.py \
            harvester_core.py \
            seattle_harvester.py \
            test_harvester_core.py

      - name: Run safe harvester core tests
        run: python test_harvester_core.py

      - name: Harvest approved Seattle source
        run: python seattle_harvester.py
